<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Analytics Linktree</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h1><i class="fas fa-chart-bar"></i> Analytics Linktree</h1>
                <p class="subtitle">Tableau de bord des clics</p>
            </div>

            <div class="stats-summary">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-mouse-pointer"></i>
                    </div>
                    <div class="stat-info">
                        <p class="stat-label">Total de clics</p>
                        <p class="stat-value" id="totalClicks">0</p>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="stat-info">
                        <p class="stat-label">Liens actifs</p>
                        <p class="stat-value" id="activeLinks">0</p>
                    </div>
                </div>
            </div>

            <div class="stats-table">
                <h2><i class="fas fa-list"></i> Détails par lien</h2>
                <div class="table-container">
                    <table id="statsTable">
                        <thead>
                            <tr>
                                <th>Lien</th>
                                <th>Clics</th>
                                <th>Pourcentage</th>
                                <th>Graphique</th>
                            </tr>
                        </thead>
                        <tbody id="statsBody">
                            <!-- Les stats seront injectées ici -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn btn-secondary" onclick="refreshStats()">
                    <i class="fas fa-sync-alt"></i> Actualiser
                </button>
                <button class="btn btn-danger" onclick="resetStats()">
                    <i class="fas fa-trash-alt"></i> Réinitialiser
                </button>
                <button class="btn btn-secondary" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Retour au site
                </a>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
