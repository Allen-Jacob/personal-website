<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jacob Allen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">

    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="titlebar-label">profile.config</span>
    </div>

    <div class="body">

      <div class="profile">
        <div class="avatar-wrap">
          <!-- Remplace photo.jpg par le nom de ta photo dans le même dossier -->
          <img class="avatar" src="photo.jpg" alt="Jacob Allen"
               onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';">
          <div class="avatar avatar-fallback" id="avatar-fallback">JA</div>
          <div class="avatar-glow"></div>
        </div>
        <span class="comment">// user_profile</span>
        <span class="name">Jacob Allen</span>
        <span class="role">student_dev</span>
        <span class="status">
          <span class="status-dot"></span>
          online
        </span>
      </div>

      <div class="links">

        <a href="https://jacoballen.ca" target="_blank" rel="noopener" class="link">
          <div class="link-icon"><i class="fa-solid fa-globe"></i></div>
          <span class="link-label">jacoballen.ca</span>
          <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
        </a>

        <a href="https://l.jacoballen.ca/github" target="_blank" rel="noopener" class="link">
          <div class="link-icon"><i class="fa-brands fa-github"></i></div>
          <span class="link-label">GitHub</span>
          <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
        </a>

        <a href="mailto:contact@jacoballen.ca" class="link">
          <div class="link-icon"><i class="fa-solid fa-envelope"></i></div>
          <span class="link-label">Email</span>
          <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
        </a>

      </div>

      <div class="socials">
        <a href="https://l.jacoballen.ca/x" target="_blank" rel="noopener" class="social" title="X">
          <i class="fa-brands fa-square-x-twitter"></i>
        </a>
        <a href="https://l.jacoballen.ca/insta" target="_blank" rel="noopener" class="social" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://l.jacoballen.ca/strava" target="_blank" rel="noopener" class="social" title="Strava">
          <i class="fa-brands fa-strava"></i>
        </a>
      </div>

      <p class="footer-note">// made in Québec 🍁</p>

    </div>
  </div>
</body>
</html>
