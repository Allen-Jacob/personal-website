<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Allen - Links</title>
    <meta name="description" content="Tous mes liens en un seul endroit">

    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Arrière-plan animé avec vagues et bulles -->
    <div class="animated-background">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
        <div class="bubbles-container" id="bubblesContainer"></div>
    </div>

    <!-- Contenu principal -->
    <div class="container">
        <div class="profile-card">
            <!-- Photo de profil - Remplacez par votre photo -->
            <div class="profile-image">
                <img src="/img/avatar.jpg" alt="Photo de Jacob Allen">
            </div>

            <!-- Nom -->
            <h1 class="profile-name">Jacob Allen</h1>

            <!-- Description - Modifiez cette partie -->
            <p class="profile-description">
                Développeur passionné par la création d'expériences web modernes et innovantes.
            </p>

            <!-- Boutons de liens - Modifiez les URLs ci-dessous -->
            <div class="links-container">
                <a href="https://jacoballen.ca" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-globe"></i>
                    <span>Site Principal</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://youtube.com/@votre-chaine" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://github.com/votre-username" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://linkedin.com/in/votre-profil" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://instagram.com/votre-username" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>
            </div>

            <!-- Footer optionnel -->
            <div class="footer">
                <p>&copy; 2025 Jacob Allen</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
