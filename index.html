<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacob Allen - Links</title>
    <meta name="description" content="Tous mes liens en un seul endroit">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jacoballen.ca">
    <meta property="og:title" content="Jacob Allen - Links">
    <meta property="og:description" content="Tous mes liens en un seul endroit - Développeur passionné">
    <meta property="og:image" content="https://jacoballen.ca/img/avatar.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://jacoballen.ca">
    <meta property="twitter:title" content="Jacob Allen - Links">
    <meta property="twitter:description" content="Tous mes liens en un seul endroit - Développeur passionné">
    <meta property="twitter:image" content="https://jacoballen.ca/img/avatar.jpg">

    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Points animés dans le fond -->
    <div class="stars" id="stars"></div>

    <!-- Contenu principal -->
    <div class="container">
        <div class="profile-card">
            <!-- Photo de profil - Remplacez par votre photo -->
            <div class="profile-image">
                <img src="./img/avatar.jpg" alt="Photo de Jacob Allen">
            </div>

            <!-- Nom -->
            <h1 class="profile-name">Jacob Allen</h1>

            <!-- Description - Modifiez cette partie -->
            <p class="profile-description">
                Développeur passionné par la création d'expériences web modernes et innovantes.
            </p>

            <!-- Réseaux sociaux -->
            <div class="social-links">
                <a href="https://github.com/votre-username" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/votre-profil" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://twitter.com/votre-username" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://instagram.com/votre-username" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>

            <!-- Boutons de liens - Modifiez les URLs ci-dessous -->
            <div class="links-container">
                <a href="https://jacoballen.ca" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-globe"></i>
                    <span>Site Principal</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://youtube.com/@votre-chaine" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://github.com/votre-username" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://linkedin.com/in/votre-profil" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-linkedin"></i>
                    <span>LinkedIn</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>

                <a href="https://instagram.com/votre-username" class="link-button" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>
            </div>

            <!-- Footer optionnel -->
            <div class="footer">
                <p>&copy; 2025 Jacob Allen</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
